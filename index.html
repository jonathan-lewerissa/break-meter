<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Break Meter 🎱</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Break Meter 🎱</h1>

    <div class="options">
      <label>
        Table size
        <select id="table-size">
          <option value="7">7 ft (bar box)</option>
          <option value="8">8 ft</option>
          <option value="9" selected>9 ft</option>
        </select>
      </label>
      <label>
        Game
        <select id="rack">
          <option value="9ball-1" selected>9-ball (1 on spot)</option>
          <option value="9ball-9">9-ball (9 on spot)</option>
          <option value="8ball">8-ball</option>
          <option value="10ball">10-ball</option>
        </select>
      </label>
      <label>
        Unit
        <select id="unit">
          <option value="mph" selected>mph</option>
          <option value="kmh">km/h</option>
          <option value="ms">m/s</option>
          <option value="fps">ft/s</option>
        </select>
      </label>
    </div>

    <div id="kitchen-wrap">
      <div class="kitchen-hint">▲ rack — drag the cue ball to your break spot</div>
      <div id="kitchen"><div id="cueball"></div></div>
      <div id="kitchen-dist" class="kitchen-hint"></div>
    </div>

    <div id="readout">
      <div id="speed">—</div>
      <div id="speed-alt"></div>
      <canvas id="wave" width="600" height="80"></canvas>
    </div>

    <button id="arm">ARM</button>
    <p id="status">Tap ARM, then break. Mic stays local — nothing is recorded.</p>

    <section id="history">
      <div id="history-head">
        <span id="best"></span>
        <button id="clear">Clear</button>
      </div>
      <ol id="breaks"></ol>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
